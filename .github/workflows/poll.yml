name: HR Job Radar poll

# GitHub's cron is best-effort: a "*/10" schedule was measured firing every
# 29 min on average with gaps up to 7 hours, which silently lost roles. So the
# cron here is only a WATCHDOG — it restarts the poller if nothing is running.
# The real cadence lives inside poll.py, which scans every 2 min for ~5h45m.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      loop_for_minutes:
        description: "Loop duration in minutes (0 = single scan)"
        default: "345"
      notify_on_seed:
        description: "Notify on the very first run"
        type: boolean
        default: false

# Allow the poller to commit the updated seen.json back to the repo.
permissions:
  contents: write

# Only one poller alive at a time. A cron tick that fires while the long run is
# still going simply queues, then takes over once it exits.
concurrency:
  group: hr-job-radar-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # Must exceed LOOP_FOR_MINUTES so poll.py exits on its own terms and gets
    # to flush state, rather than being killed mid-cycle.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure git for state commits
        run: |
          git config user.name  "hr-job-radar[bot]"
          git config user.email "actions@users.noreply.github.com"
          git config pull.rebase true

      - name: Run poller
        env:
          LOCATION_MODE: ${{ vars.LOCATION_MODE || 'usa' }}
          INCLUDE_REMOTE: ${{ vars.INCLUDE_REMOTE || 'true' }}
          LOOKBACK_HOURS: ${{ vars.LOOKBACK_HOURS || '24' }}
          POLL_EVERY_SECONDS: ${{ vars.POLL_EVERY_SECONDS || '120' }}
          LOOP_FOR_MINUTES: ${{ github.event.inputs.loop_for_minutes || '345' }}
          PUSH_BURST_CAP: ${{ vars.PUSH_BURST_CAP || '8' }}
          NOTIFY_ON_SEED: ${{ github.event.inputs.notify_on_seed || 'false' }}
          GIT_PERSIST: "true"
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        # -u so logs stream live instead of buffering for hours
        run: python -u poll.py

      # poll.py commits as it goes; this is a last-resort flush in case it was
      # killed before its own persist step ran.
      - name: Persist seen.json
        if: always()
        run: |
          if [ -n "$(git status --porcelain seen.json)" ]; then
            git add seen.json
            git commit -m "chore: update seen roles [skip ci]"
            git pull --rebase --autostash || true
            git push || echo "push failed; next run will retry"
          else
            echo "No change to seen.json"
          fi
